<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VAULT</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#080808;--surface:#111;--surface2:#1a1a1a;--border:#222;--accent:#ff3c3c;--accent2:#ff8c42;--text:#f2f2f2;--muted:#555;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden;}
.app{display:flex;flex-direction:column;height:100vh;}
.topbar{display:flex;align-items:center;padding:0 18px;height:52px;background:var(--surface);border-bottom:1px solid var(--border);gap:14px;flex-shrink:0;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:0.1em;color:var(--accent);}
.logo span{color:var(--text);}
.tabs{display:flex;gap:3px;}
.tab{padding:5px 14px;border-radius:6px;cursor:pointer;font-size:0.78rem;color:var(--muted);transition:all 0.15s;font-weight:500;}
.tab:hover{color:var(--text);background:var(--surface2);}
.tab.active{background:var(--accent);color:#fff;}
.search-wrap{flex:1;max-width:320px;position:relative;margin-left:auto;}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
.search-box{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 12px 7px 32px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.8rem;outline:none;transition:border-color 0.2s;}
.search-box:focus{border-color:var(--accent);}
.content{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.content::-webkit-scrollbar{width:4px;}
.content::-webkit-scrollbar-thumb{background:var(--border);}
.page{display:none;padding:18px;}
.page.active{display:block;}
.cat-row{display:flex;gap:7px;margin-bottom:18px;flex-wrap:wrap;}
.cat-btn{padding:5px 13px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:0.74rem;cursor:pointer;transition:all 0.15s;}
.cat-btn:hover{border-color:var(--accent);color:var(--accent);}
.cat-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
/* MOVIE GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}
.card{background:var(--surface);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;border:1px solid var(--border);}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 36px rgba(0,0,0,0.7);border-color:var(--accent);}
.card-thumb{width:100%;aspect-ratio:2/3;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:12px;}
.card-thumb::before{content:'';position:absolute;inset:0;opacity:0.9;}
.card-poster-title{position:relative;z-index:2;font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:0.06em;text-align:center;line-height:1.15;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.8);word-break:break-word;}
.card-poster-year{position:relative;z-index:2;font-size:0.62rem;color:rgba(255,255,255,0.6);margin-top:4px;letter-spacing:0.1em;}
/* genre gradient themes */
.card-thumb.action::before{background:linear-gradient(135deg,#1a0a0a,#4a1010,#1a0a0a);}
.card-thumb.animation::before{background:linear-gradient(135deg,#0a1a2a,#0a2a4a,#102040);}
.card-thumb.comedy::before{background:linear-gradient(135deg,#1a1a0a,#3a3a10,#2a2a0a);}
.card-thumb.horror::before{background:linear-gradient(135deg,#0d0d0d,#1a001a,#0d0d0d);}
.card-thumb.scifi::before{background:linear-gradient(135deg,#050f1a,#0a2030,#051520);}
.card-thumb.thriller::before{background:linear-gradient(135deg,#0a0a1a,#151530,#0a0a20);}
.card-thumb.drama::before{background:linear-gradient(135deg,#100a00,#2a1a00,#100800);}
.card-thumb.family::before{background:linear-gradient(135deg,#0a1a0a,#102a10,#081808);}
/* decorative accent line */
.card-thumb::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;z-index:3;}
.card-thumb.action::after{background:linear-gradient(90deg,#ff3c3c,#ff8c42);}
.card-thumb.animation::after{background:linear-gradient(90deg,#3c8fff,#42d4ff);}
.card-thumb.comedy::after{background:linear-gradient(90deg,#ffcc3c,#ff8c42);}
.card-thumb.horror::after{background:linear-gradient(90deg,#8b00ff,#ff003c);}
.card-thumb.scifi::after{background:linear-gradient(90deg,#00ccff,#0055ff);}
.card-thumb.thriller::after{background:linear-gradient(90deg,#6600ff,#cc00ff);}
.card-thumb.drama::after{background:linear-gradient(90deg,#ff8c00,#ffcc00);}
.card-thumb.family::after{background:linear-gradient(90deg,#00cc66,#00ffcc);}
.play-ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.55);opacity:0;transition:opacity 0.2s;z-index:4;}
.card:hover .play-ov{opacity:1;}
.play-ov svg{width:36px;height:36px;color:#fff;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.8));}
.card-info{padding:8px 10px 10px;}
.card-title{font-size:0.76rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;}
.card-meta{font-size:0.66rem;color:var(--muted);}
.badge{display:inline-block;font-size:0.56rem;padding:2px 5px;border-radius:3px;background:var(--accent);color:#fff;margin-top:4px;font-weight:700;letter-spacing:0.05em;}
.badge.hd{background:#1a6b3a;}
/* MUSIC */
.music-list{display:flex;flex-direction:column;gap:2px;}
.mitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:background 0.15s;}
.mitem:hover{background:var(--surface);}
.mnum{width:20px;text-align:center;font-size:0.74rem;color:var(--muted);flex-shrink:0;}
.memo{width:42px;height:42px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;}
.minfo{flex:1;overflow:hidden;}
.mtitle{font-size:0.84rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.martist{font-size:0.71rem;color:var(--muted);margin-top:2px;}
.mgenre-tag{font-size:0.63rem;padding:2px 7px;border-radius:10px;border:1px solid var(--border);color:var(--muted);flex-shrink:0;}
/* MODAL */
.modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.97);display:none;flex-direction:column;}
.modal.show{display:flex;}
.mhdr{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;}
.mtitle-m{font-family:'Bebas Neue',sans-serif;font-size:1.15rem;letter-spacing:0.05em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.server-btns{display:flex;gap:6px;flex-wrap:wrap;}
.srv-btn{padding:5px 11px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:0.72rem;cursor:pointer;transition:all 0.15s;}
.srv-btn:hover{border-color:var(--accent2);color:var(--accent2);}
.srv-btn.active{background:var(--accent2);border-color:var(--accent2);color:#000;font-weight:600;}
.mclose{background:transparent;border:1px solid var(--border);color:var(--text);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:0.76rem;font-family:'DM Sans',sans-serif;transition:all 0.15s;flex-shrink:0;}
.mclose:hover{border-color:var(--accent);color:var(--accent);}
.mbody{flex:1;position:relative;background:#000;}
.mbody iframe{width:100%;height:100%;border:none;}
.mmeta{padding:8px 18px;background:var(--surface);border-top:1px solid var(--border);font-size:0.73rem;color:var(--muted);flex-shrink:0;display:flex;align-items:center;gap:16px;}
.block-warn{color:var(--accent2);font-size:0.72rem;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;color:var(--muted);gap:12px;text-align:center;}
.empty-icon{font-size:3rem;opacity:0.3;}
</style>
</head>

<div class="modal" id="modal">
  <div class="mhdr">
    <div class="mtitle-m" id="modalTitle">-</div>
    <div class="server-btns" id="serverBtns"></div>
    <button class="mclose" onclick="closeModal()">✕ Close</button>
  </div>
  <div class="mbody"><iframe id="modalFrame" src="" allowfullscreen allow="autoplay; fullscreen; encrypted-media"></iframe></div>
  <div class="mmeta">
    <span id="modalMeta"></span>
    <span class="block-warn">⚠ If blocked, try another server above</span>
  </div>
</div>

<div class="app">

    <div class="logo">VAULT<span>.</span></div>
    <div class="tabs">

      <div class="tab" onclick="showPage('music',this)">🎵 Music</div>
    </div>
    <div class="search-wrap">
      <svg class="si" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-box" id="searchBox" placeholder="Search movies..." oninput="doSearch(this.value)"/>
    </div>
  </div>

  <div class="content">
    <!-- MOVIES -->
    <div class="page active" id="page-movies">
      <div class="cat-row" id="movieCatRow">
        <button class="cat-btn active" onclick="filterMovies('all',this)">All</button>
        <button class="cat-btn" onclick="filterMovies('action',this)">Action</button>
        <button class="cat-btn" onclick="filterMovies('comedy',this)">Comedy</button>
        <button class="cat-btn" onclick="filterMovies('horror',this)">Horror</button>

        <button class="cat-btn" onclick="filterMovies('animation',this)">Animation</button>
        <button class="cat-btn" onclick="filterMovies('family',this)">Family</button>
      </div>
      <div class="grid" id="moviesGrid"></div>
    </div>

    <!-- MUSIC -->
    <div class="page" id="page-music">
      <div class="cat-row" id="musicCatRow">
        <button class="cat-btn active" onclick="filterMusic('all',this)">All</button>
        <button class="cat-btn" onclick="filterMusic('rock',this)">Rock</button>
        <button class="cat-btn" onclick="filterMusic('jazz',this)">Jazz</button>
        <button class="cat-btn" onclick="filterMusic('classical',this)">Classical</button>
        <button class="cat-btn" onclick="filterMusic('blues',this)">Blues</button>
        <button class="cat-btn" onclick="filterMusic('hiphop',this)">Hip-Hop</button>
        <button class="cat-btn" onclick="filterMusic('electronic',this)">Electronic</button>
        <button class="cat-btn" onclick="filterMusic('folk',this)">Folk</button>
        <button class="cat-btn" onclick="filterMusic('soul',this)">Soul/R&B</button>
      </div>
      <div class="music-list" id="musicList"></div>
    </div>
  </div>
</div>

let movieFilter='all', musicFilter='all', searchQ='', curPage='movies';
let curImdbId='', curMovieTitle='', curServerIdx=0;

function filterMovies(g,btn){
  movieFilter=g; searchQ=''; document.getElementById('searchBox').value='';
  document.querySelectorAll('#movieCatRow .cat-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  renderMovies();
}
function filterMusic(g,btn){
  musicFilter=g; searchQ=''; document.getElementById('searchBox').value='';
  document.querySelectorAll('#musicCatRow .cat-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  renderMusic();
}

function renderMovies(){
  const el=document.getElementById('moviesGrid');
  let items=MOVIES;
  if(searchQ) items=MOVIES.filter(m=>m.title.toLowerCase().includes(searchQ)||m.genre.includes(searchQ));
  else if(movieFilter!=='all') items=MOVIES.filter(m=>m.genre===movieFilter);
  // dedupe
  const seen=new Set(); items=items.filter(m=>{ if(seen.has(m.id))return false; seen.add(m.id);return true;});
  if(!items.length){el.innerHTML='<div class="empty"><div class="empty-icon">🎬</div><div>No results</div></div>';return;}
  el.innerHTML=items.map(m=>`
    <div class="card" onclick="openMovie('${m.id}','${esc(m.title)}','${esc(m.year)}')">
      <div class="card-thumb ${m.genre}">
        <div class="card-poster-title">${escH(m.title)}</div>
        <div class="card-poster-year">${m.year}</div>
        <div class="play-ov"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>
      </div>
      <div class="card-info">
        <div class="card-title">${escH(m.title)}</div>
        <div class="card-meta">${m.year} · ${m.genre}</div>
        <span class="badge hd">HD</span>
      </div>
    </div>`).join('');
}

function renderMusic(){
  const el=document.getElementById('musicList');
  let items=MUSIC;
  if(searchQ) items=MUSIC.filter(m=>m.title.toLowerCase().includes(searchQ)||m.artist.toLowerCase().includes(searchQ));
  else if(musicFilter!=='all') items=MUSIC.filter(m=>m.genre===musicFilter);
  if(!items.length){el.innerHTML='<div class="empty"><div class="empty-icon">🎵</div><div>No results</div></div>';return;}
  el.innerHTML=items.map((m,i)=>`
    <div class="mitem" onclick="openMusic('${m.id}','${esc(m.title)}','${esc(m.artist)}')">
      <div class="mnum">${i+1}</div>
      <div class="memo">${m.e}</div>
      <div class="minfo">
        <div class="mtitle">${escH(m.title)}</div>
        <div class="martist">${escH(m.artist)}</div>
      </div>
      <span class="mgenre-tag">${m.genre}</span>
    </div>`).join('');
}

function openMovie(imdbId, title, year){
  curImdbId=imdbId; curMovieTitle=title; curServerIdx=0;
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalMeta').textContent=year+' · Try different servers if one is blocked';
  renderServerBtns();
  loadServer(0);
  document.getElementById('modal').classList.add('show');
}

function openMusic(id, title, artist){
  curImdbId=''; curMovieTitle=title; curServerIdx=0;
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalMeta').textContent=artist+' · Free on Internet Archive';
  document.getElementById('serverBtns').innerHTML='';
  document.getElementById('modalFrame').src=`https://archive.org/embed/${id}`;
  document.getElementById('modal').classList.add('show');
}

function renderServerBtns(){
  const el=document.getElementById('serverBtns');
  el.innerHTML=SERVERS.map((s,i)=>`
    <button class="srv-btn ${i===curServerIdx?'active':''}" onclick="loadServer(${i})">${s.name}</button>
  `).join('');
}

function loadServer(idx){
  curServerIdx=idx;
  document.querySelectorAll('.srv-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  document.getElementById('modalFrame').src=SERVERS[idx].url(curImdbId);
}

function closeModal(){
  document.getElementById('modal').classList.remove('show');
  document.getElementById('modalFrame').src='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

function doSearch(q){
  searchQ=q.toLowerCase().trim();
  if(curPage==='movies') renderMovies();
  else renderMusic();
}

function showPage(p,el){
  curPage=p;
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  el.classList.add('active');
  searchQ=''; document.getElementById('searchBox').value='';
  document.getElementById('searchBox').placeholder=p==='music'?'Search music...':'Search movies...';
}

function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function esc(s){return String(s||'').replace(/'/g,'&#39;').slice(0,80);}

renderMovies();
