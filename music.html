<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WAVE — Music</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0d0d0d; --surface: #161616; --surface2: #1e1e1e; --border: #2a2a2a;
  --accent: #e8ff47; --accent2: #ff6b35; --text: #f0f0f0; --muted: #666; --muted2: #444; --player-h: 88px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; overflow:hidden; }
.app { display:grid; grid-template-columns:240px 1fr; grid-template-rows:1fr var(--player-h); height:100vh; }
.sidebar { grid-row:1/2; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
.main { grid-row:1/2; overflow-y:auto; }
.player { grid-column:1/3; grid-row:2/3; background:var(--surface); border-top:1px solid var(--border); }
.logo { padding:24px 20px 20px; display:flex; align-items:center; gap:10px; }
.logo-mark { width:32px; height:32px; background:var(--accent); border-radius:8px; display:flex; align-items:center; justify-content:center; }
.logo-text { font-family:'Syne',sans-serif; font-weight:800; font-size:1.1rem; letter-spacing:0.05em; }
.search-wrap { position:relative; padding:0 12px 16px; }
.search-icon { position:absolute; left:24px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
.search-box { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:9px 14px 9px 36px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:0.85rem; outline:none; transition:border-color 0.2s; }
.search-box:focus { border-color:var(--accent); }
.nav-label { padding:6px 20px; font-size:0.65rem; letter-spacing:0.15em; color:var(--muted); text-transform:uppercase; font-weight:600; }
.nav-item { display:flex; align-items:center; gap:12px; padding:10px 20px; cursor:pointer; font-size:0.85rem; color:var(--muted); transition:all 0.15s; position:relative; }
.nav-item:hover { color:var(--text); background:var(--surface2); }
.nav-item.active { color:var(--accent); }
.nav-item.active::before { content:''; position:absolute; left:0; top:20%; height:60%; width:2px; background:var(--accent); border-radius:0 2px 2px 0; }
.queue-section { flex:1; overflow-y:auto; border-top:1px solid var(--border); margin-top:8px; }
.queue-section::-webkit-scrollbar { width:3px; }
.queue-section::-webkit-scrollbar-thumb { background:var(--border); }
.queue-title { padding:14px 20px 8px; font-size:0.65rem; letter-spacing:0.15em; color:var(--muted); text-transform:uppercase; font-weight:600; display:flex; align-items:center; justify-content:space-between; }
.queue-count { background:var(--surface2); padding:2px 7px; border-radius:10px; font-size:0.6rem; }
.q-item { display:flex; align-items:center; gap:10px; padding:8px 20px; cursor:pointer; transition:background 0.15s; }
.q-item:hover, .q-item.playing { background:var(--surface2); }
.q-thumb { width:36px; height:36px; border-radius:6px; object-fit:cover; background:var(--surface2); flex-shrink:0; }
.q-info { flex:1; overflow:hidden; }
.q-title { font-size:0.78rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.q-artist { font-size:0.7rem; color:var(--muted); }
.q-item.playing .q-title { color:var(--accent); }
.q-remove { color:var(--muted2); cursor:pointer; padding:4px; opacity:0; transition:opacity 0.15s; font-size:0.8rem; }
.q-item:hover .q-remove { opacity:1; }
.main { scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
.main::-webkit-scrollbar { width:4px; }
.main::-webkit-scrollbar-thumb { background:var(--border); }
.section { padding:24px 28px 0; }
.section-header { display:flex; align-items:baseline; gap:12px; margin-bottom:16px; }
.section-title { font-family:'Syne',sans-serif; font-weight:700; font-size:1.2rem; }
.section-sub { font-size:0.78rem; color:var(--muted); }
.tab-bar { display:flex; gap:4px; padding:20px 28px 0; border-bottom:1px solid var(--border); }
.tab { padding:10px 16px; font-size:0.82rem; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; transition:all 0.15s; margin-bottom:-1px; }
.tab:hover { color:var(--text); }
.tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.page { display:none; }
.page.active { display:block; }
.results-list { display:flex; flex-direction:column; gap:2px; padding-bottom:20px; }
.result-item { display:flex; align-items:center; gap:14px; padding:10px 14px; border-radius:10px; cursor:pointer; transition:background 0.15s; }
.result-item:hover { background:var(--surface); }
.result-item.playing { background:var(--surface); }
.result-num { width:20px; text-align:center; font-size:0.78rem; color:var(--muted); flex-shrink:0; }
.result-item.playing .result-num { color:var(--accent); }
.result-thumb { width:48px; height:48px; border-radius:8px; object-fit:cover; background:var(--surface2); flex-shrink:0; }
.result-info { flex:1; overflow:hidden; }
.result-title { font-size:0.88rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.result-artist { font-size:0.75rem; color:var(--muted); margin-top:2px; }
.result-item.playing .result-title { color:var(--accent); }
.result-dur { font-size:0.75rem; color:var(--muted); flex-shrink:0; }
.result-add { background:transparent; border:1px solid var(--border); color:var(--muted); padding:5px 10px; border-radius:6px; cursor:pointer; font-size:0.72rem; font-family:'DM Sans',sans-serif; transition:all 0.15s; }
.result-add:hover { border-color:var(--accent); color:var(--accent); }
.empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px; color:var(--muted); text-align:center; gap:12px; }
.empty-icon { font-size:3rem; opacity:0.3; }
.player { display:flex; align-items:center; padding:0 24px; gap:20px; }
.now-playing { display:flex; align-items:center; gap:12px; width:240px; flex-shrink:0; }
.np-thumb { width:52px; height:52px; border-radius:8px; object-fit:cover; background:var(--surface2); flex-shrink:0; display:none; }
.np-info { overflow:hidden; }
.np-title { font-size:0.85rem; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:160px; }
.np-artist { font-size:0.72rem; color:var(--muted); }
.np-like { color:var(--muted2); cursor:pointer; padding:4px; margin-left:4px; transition:color 0.15s; }
.np-like:hover, .np-like.liked { color:var(--accent2); }
.controls { flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; }
.ctrl-btns { display:flex; align-items:center; gap:16px; }
.ctrl-btn { background:none; border:none; color:var(--muted); cursor:pointer; padding:6px; border-radius:50%; transition:all 0.15s; display:flex; align-items:center; justify-content:center; }
.ctrl-btn:hover { color:var(--text); }
.ctrl-btn.active { color:var(--accent); }
.play-btn { width:40px; height:40px; background:var(--accent); border:none; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform 0.15s; }
.play-btn:hover { transform:scale(1.08); }
.play-btn svg { color:#000; }
.progress-wrap { width:100%; display:flex; align-items:center; gap:10px; }
.time { font-size:0.7rem; color:var(--muted); min-width:32px; text-align:center; }
.progress-bar { flex:1; height:3px; background:var(--surface2); border-radius:2px; cursor:pointer; }
.progress-fill { height:100%; background:var(--accent); border-radius:2px; transition:width 0.5s linear; }
.vol-wrap { display:flex; align-items:center; gap:8px; width:140px; flex-shrink:0; }
.vol-btn { background:none; border:none; color:var(--muted); cursor:pointer; padding:4px; display:flex; }
.vol-slider { flex:1; height:3px; background:var(--surface2); border-radius:2px; cursor:pointer; }
.vol-fill { height:100%; background:var(--muted); border-radius:2px; }
.toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface2); border:1px solid var(--border); padding:10px 20px; border-radius:8px; font-size:0.8rem; opacity:0; transition:all 0.3s; pointer-events:none; z-index:999; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
#yt-player { position:fixed; top:-9999px; left:-9999px; width:1px; height:1px; }
#embed-overlay { position:fixed; inset:0; z-index:500; background:rgba(0,0,0,0.92); display:none; align-items:center; justify-content:center; flex-direction:column; gap:16px; }
#embed-overlay.show { display:flex; }
#embed-frame { width:640px; height:360px; max-width:90vw; max-height:50vh; border:none; border-radius:12px; }
.embed-info { color:#fff; text-align:center; }
.embed-title { font-size:1rem; font-weight:600; margin-bottom:4px; }
.embed-artist { font-size:0.8rem; color:#888; }
.embed-close { position:absolute; top:20px; right:20px; background:transparent; border:1px solid #444; color:#fff; padding:8px 16px; border-radius:8px; cursor:pointer; font-size:0.8rem; }
.embed-nav { display:flex; gap:12px; margin-top:8px; }
.embed-btn { background:transparent; border:1px solid #333; color:#ccc; padding:8px 20px; border-radius:8px; cursor:pointer; font-size:0.8rem; transition:all 0.15s; }
.embed-btn:hover { border-color:#e8ff47; color:#e8ff47; }
</style>
</head>

<div id="embed-overlay">
  <button class="embed-close" onclick="closeEmbed()">✕ Close</button>
  <iframe id="embed-frame" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
  <div class="embed-info">

      </div>

      </div>
    </div>
    <div class="controls">

        <button class="ctrl-btn" onclick="nextSong()"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-8.14 5.5 3.89L8 13.86V9.86zM16 6h2v12h-2z"/></svg></button>

    </div>
    <div class="vol-wrap">

      <div class="vol-slider" onclick="setVol(event)"><div class="vol-fill" id="volFill" style="width:80%"></div></div>
    </div>
  </div>
</div>

// ── STATE ──
let player = null, queue = [], currentIdx = -1, isPlaying = false;
let isShuffle = false, isRepeat = false, isMuted = false, volume = 80;
let liked = JSON.parse(localStorage.getItem('wave_liked') || '[]');
let progressInterval = null, currentTab = 'trending';

// ── YT EMBED (direct - works even when IFrame API is blocked) ──
window.onYouTubeIframeAPIReady = function() {
  // Try IFrame API first
  player = new YT.Player('yt-player', {
    height:'1', width:'1',
    playerVars:{autoplay:0, controls:0},
    events:{
      onStateChange: onPlayerState,
      onReady: () => { player.setVolume(volume); loadTab('trending'); }
    }
  });
};

// Fallback if IFrame API fails - just load tab directly
setTimeout(() => { if (!player) loadTab('trending'); }, 3000);

function onPlayerState(e) {
  if (e.data === YT.PlayerState.PLAYING) { isPlaying=true; updatePlayBtn(); startProgress(); }
  else if (e.data === YT.PlayerState.PAUSED) { isPlaying=false; updatePlayBtn(); }
  else if (e.data === YT.PlayerState.ENDED) { isRepeat ? player.seekTo(0)||player.playVideo() : nextSong(); }
}

function openEmbed(song) {
  document.getElementById('embedTitle').textContent = song.title;
  document.getElementById('embedArtist').textContent = song.artist;
  document.getElementById('embed-frame').src = `https://www.youtube-nocookie.com/embed/${song.id}?autoplay=1&rel=0`;
  document.getElementById('embed-overlay').classList.add('show');
  isPlaying = true;
  updatePlayBtn();
}

function closeEmbed() {
  document.getElementById('embed-overlay').classList.remove('show');
  document.getElementById('embed-frame').src = '';
  isPlaying = false;
  updatePlayBtn();
}

// ── SEARCH ──
function liveSearch(q) {
  if (!q.trim()) { document.getElementById('searchLabel').textContent='Type to search'; document.getElementById('searchResults').innerHTML='<div class="empty-state"><div class="empty-icon">🎵</div><div>Search for a song or artist</div></div>'; return; }
  showPage('search-page', document.getElementById('nav-search-page'));
  const results = LIBRARY.filter(s =>
    s.title.toLowerCase().includes(q.toLowerCase()) ||
    s.artist.toLowerCase().includes(q.toLowerCase())
  );
  document.getElementById('searchLabel').textContent = `"${q}" — ${results.length} results`;
  renderResults(results, 'searchResults');
}

// ── TABS ──
function loadTab(tab) {
  currentTab = tab;
  const results = LIBRARY.filter(s => s.genre === tab);
  renderResults(results, 'homeResults');
}
function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  loadTab(tab);
}

// ── RENDER ──
function renderResults(items, containerId) {
  const el = document.getElementById(containerId);
  if (!items.length) { el.innerHTML='<div class="empty-state"><div class="empty-icon">🔍</div><div>No results found</div></div>'; return; }
  el.innerHTML = items.map((item,i) => `
    <div class="result-item ${currentIdx>=0&&queue[currentIdx]?.id===item.id?'playing':''}" onclick="playSong(${i},${JSON.stringify(items).replace(/"/g,'&quot;')})">
      <div class="result-num">${currentIdx>=0&&queue[currentIdx]?.id===item.id?'▶':i+1}</div>
      <img class="result-thumb" src="https://i.ytimg.com/vi/${item.id}/mqdefault.jpg" onerror="this.style.opacity=0"/>
      <div class="result-info">
        <div class="result-title">${escHtml(item.title)}</div>
        <div class="result-artist">${escHtml(item.artist)}</div>
      </div>
      <div class="result-dur">${fmtTime(item.dur)}</div>
      <button class="result-add" onclick="event.stopPropagation();addToQueue(${JSON.stringify(item).replace(/"/g,'&quot;')})">+ Queue</button>
    </div>
  `).join('');
}

function renderLiked() {
  document.getElementById('likedCount').textContent = `${liked.length} songs`;
  const el = document.getElementById('likedResults');
  if (!liked.length) { el.innerHTML='<div class="empty-state"><div class="empty-icon">💛</div><div>Songs you like will appear here</div></div>'; return; }
  renderResults(liked, 'likedResults');
}

// ── PLAYBACK ──
function playSong(idx, list) {
  const song = list[idx];
  queue = [...list];
  currentIdx = idx;
  loadSong(currentIdx);
}

function loadSong(idx) {
  if (idx<0||idx>=queue.length) return;
  currentIdx = idx;
  const song = queue[idx];
  document.getElementById('npTitle').textContent = song.title;
  document.getElementById('npArtist').textContent = song.artist;
  const thumb = document.getElementById('npThumb');
  thumb.src = `https://i.ytimg.com/vi/${song.id}/mqdefault.jpg`;
  thumb.style.display = 'block';
  const isLiked = liked.some(l=>l.id===song.id);
  const likeBtn = document.getElementById('npLike');
  likeBtn.classList.toggle('liked', isLiked);
  likeBtn.querySelector('svg').setAttribute('fill', isLiked?'currentColor':'none');
  updateQueue();
  // Try IFrame API first, fall back to embed overlay
  if (player && player.loadVideoById) {
    try { player.loadVideoById(song.id); return; } catch(e) {}
  }
  openEmbed(song);
}

function togglePlay() {
  if (queue.length===0) return;
  if (player && player.getPlayerState) {
    try { isPlaying ? player.pauseVideo() : player.playVideo(); return; } catch(e) {}
  }
  // Fallback to embed overlay
  if (!isPlaying) openEmbed(queue[currentIdx]);
  else closeEmbed();
}
function updatePlayBtn() {
  document.getElementById('playIcon').innerHTML = isPlaying
    ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}
function nextSong() {
  if (!queue.length) return;
  currentIdx = isShuffle ? Math.floor(Math.random()*queue.length) : (currentIdx+1)%queue.length;
  loadSong(currentIdx);
}
function prevSong() {
  if (!queue.length) return;
  if ((player?.getCurrentTime()||0)>3) { player.seekTo(0); return; }
  currentIdx = (currentIdx-1+queue.length)%queue.length;
  loadSong(currentIdx);
}
function addToQueue(song) {
  if (queue.some(s=>s.id===song.id)) { toast('Already in queue'); return; }
  queue.push(song);
  updateQueue();
  toast(`Added: ${song.title.slice(0,25)}`);
  if (queue.length===1) { currentIdx=0; loadSong(0); }
}
function updateQueue() {
  document.getElementById('queueCount').textContent = queue.length;
  const el = document.getElementById('queueList');
  el.innerHTML = queue.map((s,i) => `
    <div class="q-item ${i===currentIdx?'playing':''}" onclick="loadSong(${i})">
      <img class="q-thumb" src="https://i.ytimg.com/vi/${s.id}/mqdefault.jpg" onerror="this.style.opacity=0"/>
      <div class="q-info"><div class="q-title">${escHtml(s.title)}</div><div class="q-artist">${escHtml(s.artist)}</div></div>
      <span class="q-remove" onclick="event.stopPropagation();removeFromQueue(${i})">✕</span>
    </div>
  `).join('');
}
function removeFromQueue(idx) { queue.splice(idx,1); if(currentIdx>=idx&&currentIdx>0)currentIdx--; updateQueue(); }

function startProgress() {
  clearInterval(progressInterval);
  progressInterval = setInterval(() => {
    if (!player||!isPlaying) return;
    const cur = player.getCurrentTime()||0, dur = player.getDuration()||1;
    document.getElementById('progressFill').style.width = (cur/dur*100)+'%';
    document.getElementById('timeCur').textContent = fmtTime(Math.floor(cur));
    document.getElementById('timeTot').textContent = fmtTime(Math.floor(dur));
  }, 500);
}
function seekTo(e) { if(!player)return; const b=document.getElementById('progressBar')||e.currentTarget; player.seekTo((e.offsetX/e.currentTarget.offsetWidth)*player.getDuration()); }
function toggleShuffle() { isShuffle=!isShuffle; document.getElementById('shuffleBtn').classList.toggle('active',isShuffle); }
function toggleRepeat() { isRepeat=!isRepeat; document.getElementById('repeatBtn').classList.toggle('active',isRepeat); }
function toggleMute() { if(!player)return; isMuted=!isMuted; isMuted?player.mute():player.unMute(); }
function setVol(e) { volume=Math.round(e.offsetX/e.currentTarget.offsetWidth*100); document.getElementById('volFill').style.width=volume+'%'; if(player)player.setVolume(volume); }

function toggleLike() {
  if (currentIdx<0) return;
  const song = queue[currentIdx];
  const idx = liked.findIndex(l=>l.id===song.id);
  idx===-1 ? liked.push(song) : liked.splice(idx,1);
  localStorage.setItem('wave_liked', JSON.stringify(liked));
  loadSong(currentIdx);
  toast(idx===-1?'Added to Liked Songs':'Removed from Liked Songs');
  renderLiked();
}

function showPage(pageId, navEl) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-'+pageId)?.classList.add('active');
  if (navEl) navEl.classList.add('active');
  if (pageId==='liked') renderLiked();
}

function fmtTime(s) { if(!s||isNaN(s))return'0:00'; return`${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`; }
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg) { const e=document.getElementById('toast'); e.textContent=msg; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),2500); }

const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);
</script>
