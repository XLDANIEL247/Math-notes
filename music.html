<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WAVE — Music</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0d0d0d;
  --surface: #161616;
  --surface2: #1e1e1e;
  --border: #2a2a2a;
  --accent: #e8ff47;
  --accent2: #ff6b35;
  --text: #f0f0f0;
  --muted: #666;
  --muted2: #444;
  --player-h: 88px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; overflow:hidden; }

/* LAYOUT */
.app { display:grid; grid-template-columns:240px 1fr; grid-template-rows:1fr var(--player-h); height:100vh; }
.sidebar { grid-row:1/2; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
.main { grid-row:1/2; overflow-y:auto; position:relative; }
.player { grid-column:1/3; grid-row:2/3; background:var(--surface); border-top:1px solid var(--border); }

/* SIDEBAR */
.logo { padding:24px 20px 20px; display:flex; align-items:center; gap:10px; }
.logo-mark { width:32px; height:32px; background:var(--accent); border-radius:8px; display:flex; align-items:center; justify-content:center; }
.logo-mark svg { width:18px; height:18px; }
.logo-text { font-family:'Syne',sans-serif; font-weight:800; font-size:1.1rem; letter-spacing:0.05em; }

.search-wrap { padding:0 12px 16px; }
.search-box { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:9px 14px 9px 36px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:0.85rem; outline:none; position:relative; transition:border-color 0.2s; }
.search-box:focus { border-color:var(--accent); }
.search-wrap { position:relative; padding:0 12px 16px; }
.search-icon { position:absolute; left:24px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }

.nav-label { padding:6px 20px; font-size:0.65rem; letter-spacing:0.15em; color:var(--muted); text-transform:uppercase; font-weight:600; }
.nav-item { display:flex; align-items:center; gap:12px; padding:10px 20px; cursor:pointer; border-radius:0; font-size:0.85rem; color:var(--muted); transition:all 0.15s; position:relative; }
.nav-item:hover { color:var(--text); background:var(--surface2); }
.nav-item.active { color:var(--accent); }
.nav-item.active::before { content:''; position:absolute; left:0; top:20%; height:60%; width:2px; background:var(--accent); border-radius:0 2px 2px 0; }

.queue-section { flex:1; overflow-y:auto; border-top:1px solid var(--border); margin-top:8px; }
.queue-section::-webkit-scrollbar { width:3px; }
.queue-section::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
.queue-title { padding:14px 20px 8px; font-size:0.65rem; letter-spacing:0.15em; color:var(--muted); text-transform:uppercase; font-weight:600; display:flex; align-items:center; justify-content:space-between; }
.queue-count { background:var(--surface2); padding:2px 7px; border-radius:10px; font-size:0.6rem; }
.q-item { display:flex; align-items:center; gap:10px; padding:8px 20px; cursor:pointer; transition:background 0.15s; }
.q-item:hover { background:var(--surface2); }
.q-item.playing { background:var(--surface2); }
.q-thumb { width:36px; height:36px; border-radius:6px; object-fit:cover; background:var(--surface2); flex-shrink:0; }
.q-info { flex:1; overflow:hidden; }
.q-title { font-size:0.78rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.q-artist { font-size:0.7rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.q-item.playing .q-title { color:var(--accent); }
.q-remove { color:var(--muted2); cursor:pointer; padding:4px; border-radius:4px; opacity:0; transition:opacity 0.15s; font-size:0.8rem; }
.q-item:hover .q-remove { opacity:1; }

/* MAIN */
.main { scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
.main::-webkit-scrollbar { width:4px; }
.main::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

.section { padding:28px 28px 0; }
.section-header { display:flex; align-items:baseline; gap:12px; margin-bottom:20px; }
.section-title { font-family:'Syne',sans-serif; font-weight:700; font-size:1.3rem; }
.section-sub { font-size:0.78rem; color:var(--muted); }

/* FEATURED */
.featured-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; }
.feat-card { background:var(--surface); border-radius:12px; overflow:hidden; cursor:pointer; transition:transform 0.2s, box-shadow 0.2s; border:1px solid var(--border); }
.feat-card:hover { transform:translateY(-3px); box-shadow:0 12px 30px rgba(0,0,0,0.4); }
.feat-thumb { width:100%; aspect-ratio:1; object-fit:cover; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:2.5rem; }
.feat-thumb img { width:100%; height:100%; object-fit:cover; }
.feat-info { padding:10px 12px 12px; }
.feat-name { font-size:0.82rem; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.feat-meta { font-size:0.72rem; color:var(--muted); margin-top:2px; }

/* RESULTS */
.results-list { display:flex; flex-direction:column; gap:2px; }
.result-item { display:flex; align-items:center; gap:14px; padding:10px 14px; border-radius:10px; cursor:pointer; transition:background 0.15s; }
.result-item:hover { background:var(--surface); }
.result-item.playing { background:var(--surface); }
.result-num { width:20px; text-align:center; font-size:0.78rem; color:var(--muted); flex-shrink:0; }
.result-item.playing .result-num { color:var(--accent); }
.result-thumb { width:48px; height:48px; border-radius:8px; object-fit:cover; background:var(--surface2); flex-shrink:0; }
.result-info { flex:1; overflow:hidden; }
.result-title { font-size:0.88rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.result-artist { font-size:0.75rem; color:var(--muted); margin-top:2px; }
.result-item.playing .result-title { color:var(--accent); }
.result-dur { font-size:0.75rem; color:var(--muted); flex-shrink:0; }
.result-add { background:transparent; border:1px solid var(--border); color:var(--muted); padding:5px 10px; border-radius:6px; cursor:pointer; font-size:0.72rem; font-family:'DM Sans',sans-serif; transition:all 0.15s; white-space:nowrap; }
.result-add:hover { border-color:var(--accent); color:var(--accent); }

/* PLAYER */
.player { display:flex; align-items:center; padding:0 24px; gap:20px; }
.now-playing { display:flex; align-items:center; gap:12px; width:240px; flex-shrink:0; }
.np-thumb { width:52px; height:52px; border-radius:8px; object-fit:cover; background:var(--surface2); flex-shrink:0; }
.np-info { overflow:hidden; }
.np-title { font-size:0.85rem; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:160px; }
.np-artist { font-size:0.72rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:160px; }
.np-like { color:var(--muted2); cursor:pointer; padding:4px; margin-left:4px; transition:color 0.15s; }
.np-like:hover, .np-like.liked { color:var(--accent2); }

.controls { flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; }
.ctrl-btns { display:flex; align-items:center; gap:16px; }
.ctrl-btn { background:none; border:none; color:var(--muted); cursor:pointer; padding:6px; border-radius:50%; transition:all 0.15s; display:flex; align-items:center; justify-content:center; }
.ctrl-btn:hover { color:var(--text); }
.ctrl-btn.active { color:var(--accent); }
.play-btn { width:40px; height:40px; background:var(--accent); border:none; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform 0.15s, background 0.15s; }
.play-btn:hover { transform:scale(1.08); background:#d4eb3d; }
.play-btn svg { color:#000; }

.progress-wrap { width:100%; display:flex; align-items:center; gap:10px; }
.time { font-size:0.7rem; color:var(--muted); min-width:32px; text-align:center; font-variant-numeric:tabular-nums; }
.progress-bar { flex:1; height:3px; background:var(--surface2); border-radius:2px; cursor:pointer; position:relative; }
.progress-fill { height:100%; background:var(--accent); border-radius:2px; transition:width 0.5s linear; position:relative; }
.progress-fill::after { content:''; position:absolute; right:-4px; top:-3px; width:9px; height:9px; background:var(--text); border-radius:50%; opacity:0; transition:opacity 0.15s; }
.progress-bar:hover .progress-fill::after { opacity:1; }

.vol-wrap { display:flex; align-items:center; gap:8px; width:160px; flex-shrink:0; }
.vol-btn { background:none; border:none; color:var(--muted); cursor:pointer; padding:4px; display:flex; }
.vol-slider { flex:1; height:3px; background:var(--surface2); border-radius:2px; cursor:pointer; }
.vol-fill { height:100%; background:var(--muted); border-radius:2px; }

/* LOADING */
.loading { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px; color:var(--muted); gap:16px; }
.spinner { width:28px; height:28px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* EMPTY */
.empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px; color:var(--muted); text-align:center; gap:12px; }
.empty-icon { font-size:3rem; opacity:0.3; }
.empty-text { font-size:0.88rem; }

/* HIDDEN YT */
#yt-player { position:fixed; top:-9999px; left:-9999px; width:1px; height:1px; opacity:0; pointer-events:none; }

/* SCROLLBAR */
.main { scrollbar-width:thin; }

/* TOAST */
.toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface2); border:1px solid var(--border); padding:10px 20px; border-radius:8px; font-size:0.8rem; opacity:0; transition:all 0.3s; pointer-events:none; z-index:999; white-space:nowrap; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* TABS */
.tab-bar { display:flex; gap:4px; padding:20px 28px 0; border-bottom:1px solid var(--border); margin-bottom:0; }
.tab { padding:10px 18px; font-size:0.82rem; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; transition:all 0.15s; margin-bottom:-1px; }
.tab:hover { color:var(--text); }
.tab.active { color:var(--accent); border-bottom-color:var(--accent); }

.page { display:none; }
.page.active { display:block; }
</style>
</head>
<body>

<div id="yt-player"></div>
<div class="toast" id="toast"></div>

<div class="app">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round">
          <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      <span class="logo-text">WAVE</span>
    </div>

    <div class="search-wrap">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-box" id="searchInput" placeholder="Search songs, artists..." onkeydown="handleSearch(event)"/>
    </div>

    <span class="nav-label">Menu</span>
    <div class="nav-item active" onclick="showPage('home',this)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </div>
    <div class="nav-item" onclick="showPage('search-page',this)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      Search
    </div>
    <div class="nav-item" onclick="showPage('liked',this)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      Liked Songs
    </div>

    <div class="queue-section">
      <div class="queue-title">
        Queue <span class="queue-count" id="queueCount">0</span>
      </div>
      <div id="queueList"></div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main" id="mainContent">
    <!-- HOME PAGE -->
    <div id="page-home" class="page active">
      <div class="tab-bar">
        <div class="tab active" onclick="switchTab('trending',this)">Trending</div>
        <div class="tab" onclick="switchTab('hiphop',this)">Hip-Hop</div>
        <div class="tab" onclick="switchTab('pop',this)">Pop</div>
        <div class="tab" onclick="switchTab('rnb',this)">R&B</div>
        <div class="tab" onclick="switchTab('gaming',this)">Gaming</div>
      </div>
      <div class="section">
        <div id="homeResults" class="results-list">
          <div class="loading"><div class="spinner"></div><span>Loading music...</span></div>
        </div>
      </div>
    </div>

    <!-- SEARCH PAGE -->
    <div id="page-search-page" class="page">
      <div class="section">
        <div class="section-header">
          <span class="section-title">Search Results</span>
          <span class="section-sub" id="searchLabel"></span>
        </div>
        <div id="searchResults" class="results-list">
          <div class="empty-state">
            <div class="empty-icon">🎵</div>
            <div class="empty-text">Search for a song or artist above</div>
          </div>
        </div>
      </div>
    </div>

    <!-- LIKED PAGE -->
    <div id="page-liked" class="page">
      <div class="section">
        <div class="section-header">
          <span class="section-title">Liked Songs</span>
          <span class="section-sub" id="likedCount">0 songs</span>
        </div>
        <div id="likedResults" class="results-list">
          <div class="empty-state">
            <div class="empty-icon">💛</div>
            <div class="empty-text">Songs you like will appear here</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- PLAYER -->
  <div class="player">
    <div class="now-playing">
      <img class="np-thumb" id="npThumb" src="" onerror="this.style.display='none'" style="display:none"/>
      <div class="np-info">
        <div class="np-title" id="npTitle">Nothing playing</div>
        <div class="np-artist" id="npArtist">Select a song to play</div>
      </div>
      <div class="np-like" id="npLike" onclick="toggleLike()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </div>
    </div>

    <div class="controls">
      <div class="ctrl-btns">
        <button class="ctrl-btn" id="shuffleBtn" onclick="toggleShuffle()" title="Shuffle">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        </button>
        <button class="ctrl-btn" onclick="prevSong()" title="Previous">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button class="play-btn" id="playBtn" onclick="togglePlay()">
          <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctrl-btn" onclick="nextSong()" title="Next">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-8.14 5.5 3.89L8 13.86V9.86zM16 6h2v12h-2z"/></svg>
        </button>
        <button class="ctrl-btn" id="repeatBtn" onclick="toggleRepeat()" title="Repeat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>
      <div class="progress-wrap">
        <span class="time" id="timeCur">0:00</span>
        <div class="progress-bar" id="progressBar" onclick="seekTo(event)">
          <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
        <span class="time" id="timeTot">0:00</span>
      </div>
    </div>

    <div class="vol-wrap">
      <button class="vol-btn" onclick="toggleMute()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="volIcon"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </button>
      <div class="vol-slider" onclick="setVol(event)" id="volSlider">
        <div class="vol-fill" id="volFill" style="width:80%"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ── STATE ──
let player = null;
let queue = [];
let currentIdx = -1;
let isPlaying = false;
let isShuffle = false;
let isRepeat = false;
let isMuted = false;
let volume = 80;
let liked = JSON.parse(localStorage.getItem('wave_liked') || '[]');
let progressInterval = null;
let currentTab = 'trending';

// ── YT API ──
window.onYouTubeIframeAPIReady = function() {
  player = new YT.Player('yt-player', {
    height:'1', width:'1',
    playerVars:{ autoplay:0, controls:0 },
    events:{
      onStateChange: onPlayerState,
      onReady: () => { player.setVolume(volume); loadTab(currentTab); }
    }
  });
};

function onPlayerState(e) {
  if (e.data === YT.PlayerState.PLAYING) {
    isPlaying = true;
    updatePlayBtn();
    startProgress();
  } else if (e.data === YT.PlayerState.PAUSED) {
    isPlaying = false;
    updatePlayBtn();
  } else if (e.data === YT.PlayerState.ENDED) {
    if (isRepeat) { player.seekTo(0); player.playVideo(); }
    else nextSong();
  }
}

// ── INVIDIOUS API ──
const INSTANCES = [
  'https://inv.nadeko.net',
  'https://invidious.privacyredirect.com',
  'https://invidious.perennialte.ch',
  'https://yt.cdaut.de',
  'https://invidious.drgns.space',
  'https://iv.datura.network',
];
let instanceIdx = 0;

async function apiSearch(query, max=15) {
  for (let i = 0; i < INSTANCES.length; i++) {
    const base = INSTANCES[(instanceIdx + i) % INSTANCES.length];
    try {
      const r = await fetch(`${base}/api/v1/search?q=${encodeURIComponent(query)}&type=video&fields=videoId,title,author,lengthSeconds,videoThumbnails&page=1`, {signal: AbortSignal.timeout(6000)});
      if (!r.ok) continue;
      const data = await r.json();
      if (!data || !data.length) continue;
      instanceIdx = (instanceIdx + i) % INSTANCES.length;
      return data.slice(0, max).map(v => ({
        id: v.videoId,
        title: v.title,
        artist: v.author,
        duration: v.lengthSeconds,
        thumb: `https://i.ytimg.com/vi/${v.videoId}/mqdefault.jpg`
      }));
    } catch(e) { continue; }
  }
  // Last resort: use corsproxy to hit an invidious instance
  try {
    const r = await fetch(`https://corsproxy.io/?${encodeURIComponent(`https://inv.nadeko.net/api/v1/search?q=${encodeURIComponent(query)}&type=video&page=1`)}`, {signal: AbortSignal.timeout(8000)});
    if (r.ok) {
      const data = await r.json();
      return (data||[]).slice(0,max).map(v => ({
        id: v.videoId, title: v.title, artist: v.author,
        duration: v.lengthSeconds,
        thumb: `https://i.ytimg.com/vi/${v.videoId}/mqdefault.jpg`
      }));
    }
  } catch(e) {}
  return [];
}

// ── TABS ──
const TAB_QUERIES = {
  trending: 'top hits 2025',
  hiphop: 'hip hop hits 2025',
  pop: 'pop music 2025',
  rnb: 'rnb songs 2025',
  gaming: 'gaming music mix 2025'
};

async function loadTab(tab) {
  currentTab = tab;
  const el = document.getElementById('homeResults');
  el.innerHTML = '<div class="loading"><div class="spinner"></div><span>Loading...</span></div>';
  const results = await apiSearch(TAB_QUERIES[tab], 20);
  renderResults(results, 'homeResults');
}

function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  loadTab(tab);
}

// ── SEARCH ──
async function handleSearch(e) {
  if (e.key !== 'Enter') return;
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  showPage('search-page', document.querySelectorAll('.nav-item')[1]);
  document.getElementById('searchLabel').textContent = `"${q}"`;
  document.getElementById('searchResults').innerHTML = '<div class="loading"><div class="spinner"></div><span>Searching...</span></div>';
  const results = await apiSearch(q, 20);
  renderResults(results, 'searchResults');
}

// ── RENDER ──
function renderResults(items, containerId) {
  const el = document.getElementById(containerId);
  if (!items.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">No results found</div></div>';
    return;
  }
  el.innerHTML = items.map((item, i) => `
    <div class="result-item ${currentIdx >= 0 && queue[currentIdx]?.id === item.id ? 'playing' : ''}" onclick="playSong(${JSON.stringify(item).replace(/"/g,'&quot;')})">
      <div class="result-num">${i+1}</div>
      <img class="result-thumb" src="${item.thumb}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22><rect fill=%22%231e1e1e%22 width=%2248%22 height=%2248%22/><text y=%2232%22 x=%2210%22 font-size=%2224%22>🎵</text></svg>'"/>
      <div class="result-info">
        <div class="result-title">${escHtml(item.title)}</div>
        <div class="result-artist">${escHtml(item.artist)}</div>
      </div>
      <div class="result-dur">${fmtTime(item.duration)}</div>
      <button class="result-add" onclick="event.stopPropagation();addToQueue(${JSON.stringify(item).replace(/"/g,'&quot;')})">+ Queue</button>
    </div>
  `).join('');
}

function renderLiked() {
  const el = document.getElementById('likedResults');
  document.getElementById('likedCount').textContent = `${liked.length} songs`;
  if (!liked.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">💛</div><div class="empty-text">Songs you like will appear here</div></div>';
    return;
  }
  el.innerHTML = liked.map((item, i) => `
    <div class="result-item" onclick="playSong(${JSON.stringify(item).replace(/"/g,'&quot;')})">
      <div class="result-num">${i+1}</div>
      <img class="result-thumb" src="${item.thumb}" onerror="this.src=''"/>
      <div class="result-info">
        <div class="result-title">${escHtml(item.title)}</div>
        <div class="result-artist">${escHtml(item.artist)}</div>
      </div>
      <div class="result-dur">${fmtTime(item.duration)}</div>
    </div>
  `).join('');
}

// ── PLAYBACK ──
function playSong(song) {
  // Add to front of queue if not already there
  const existingIdx = queue.findIndex(s => s.id === song.id);
  if (existingIdx === -1) {
    queue.splice(currentIdx + 1, 0, song);
    currentIdx = currentIdx + 1;
  } else {
    currentIdx = existingIdx;
  }
  loadSong(currentIdx);
}

function loadSong(idx) {
  if (idx < 0 || idx >= queue.length) return;
  currentIdx = idx;
  const song = queue[idx];
  if (!player) return;
  player.loadVideoById(song.id);
  updateNowPlaying(song);
  updateQueue();
}

function updateNowPlaying(song) {
  document.getElementById('npTitle').textContent = song.title;
  document.getElementById('npArtist').textContent = song.artist;
  const thumb = document.getElementById('npThumb');
  thumb.src = song.thumb;
  thumb.style.display = 'block';
  // Update like button
  const isLiked = liked.some(l => l.id === song.id);
  const likeBtn = document.getElementById('npLike');
  likeBtn.classList.toggle('liked', isLiked);
  likeBtn.querySelector('svg').setAttribute('fill', isLiked ? 'currentColor' : 'none');
}

function togglePlay() {
  if (!player || queue.length === 0) return;
  if (isPlaying) { player.pauseVideo(); }
  else { player.playVideo(); }
}

function updatePlayBtn() {
  const icon = document.getElementById('playIcon');
  if (isPlaying) {
    icon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
  } else {
    icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
  }
}

function nextSong() {
  if (queue.length === 0) return;
  if (isShuffle) {
    currentIdx = Math.floor(Math.random() * queue.length);
  } else {
    currentIdx = (currentIdx + 1) % queue.length;
  }
  loadSong(currentIdx);
}

function prevSong() {
  if (queue.length === 0) return;
  const t = player?.getCurrentTime() || 0;
  if (t > 3) { player.seekTo(0); return; }
  currentIdx = (currentIdx - 1 + queue.length) % queue.length;
  loadSong(currentIdx);
}

function addToQueue(song) {
  if (queue.some(s => s.id === song.id)) { toast('Already in queue'); return; }
  queue.push(song);
  updateQueue();
  toast(`Added: ${song.title.slice(0,30)}...`);
  if (queue.length === 1) { currentIdx = 0; loadSong(0); }
}

function updateQueue() {
  document.getElementById('queueCount').textContent = queue.length;
  const el = document.getElementById('queueList');
  if (!queue.length) { el.innerHTML = ''; return; }
  el.innerHTML = queue.map((s, i) => `
    <div class="q-item ${i === currentIdx ? 'playing' : ''}" onclick="loadSong(${i})">
      <img class="q-thumb" src="${s.thumb}" onerror="this.src=''"/>
      <div class="q-info">
        <div class="q-title">${escHtml(s.title)}</div>
        <div class="q-artist">${escHtml(s.artist)}</div>
      </div>
      <span class="q-remove" onclick="event.stopPropagation();removeFromQueue(${i})">✕</span>
    </div>
  `).join('');
}

function removeFromQueue(idx) {
  queue.splice(idx, 1);
  if (currentIdx >= idx && currentIdx > 0) currentIdx--;
  updateQueue();
}

// ── PROGRESS ──
function startProgress() {
  clearInterval(progressInterval);
  progressInterval = setInterval(() => {
    if (!player || !isPlaying) return;
    const cur = player.getCurrentTime() || 0;
    const dur = player.getDuration() || 1;
    document.getElementById('progressFill').style.width = (cur/dur*100) + '%';
    document.getElementById('timeCur').textContent = fmtTime(Math.floor(cur));
    document.getElementById('timeTot').textContent = fmtTime(Math.floor(dur));
  }, 500);
}

function seekTo(e) {
  if (!player) return;
  const bar = document.getElementById('progressBar');
  const pct = e.offsetX / bar.offsetWidth;
  player.seekTo(pct * player.getDuration());
}

// ── CONTROLS ──
function toggleShuffle() {
  isShuffle = !isShuffle;
  document.getElementById('shuffleBtn').classList.toggle('active', isShuffle);
}

function toggleRepeat() {
  isRepeat = !isRepeat;
  document.getElementById('repeatBtn').classList.toggle('active', isRepeat);
}

function toggleMute() {
  if (!player) return;
  isMuted = !isMuted;
  isMuted ? player.mute() : player.unMute();
}

function setVol(e) {
  const bar = document.getElementById('volSlider');
  volume = Math.round(e.offsetX / bar.offsetWidth * 100);
  document.getElementById('volFill').style.width = volume + '%';
  if (player) player.setVolume(volume);
}

// ── LIKE ──
function toggleLike() {
  if (currentIdx < 0) return;
  const song = queue[currentIdx];
  const idx = liked.findIndex(l => l.id === song.id);
  if (idx === -1) {
    liked.push(song);
    toast('Added to Liked Songs');
  } else {
    liked.splice(idx, 1);
    toast('Removed from Liked Songs');
  }
  localStorage.setItem('wave_liked', JSON.stringify(liked));
  updateNowPlaying(song);
  renderLiked();
}

// ── NAV ──
function showPage(pageId, navEl) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + pageId)?.classList.add('active');
  if (navEl) navEl.classList.add('active');
  if (pageId === 'liked') renderLiked();
}

// ── UTILS ──
function fmtTime(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// Load YT API
const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);
</script>
</body>
</html>
